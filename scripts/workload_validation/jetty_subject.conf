# Subject of workload_validation_jetty.sh. This file is sourced by bash.
#
#   SUBJECT      name of the results folder
#   IMAGE        the JDK 8 / Debian 10 image SysJava analyzed (built locally if missing)
#   POLICY       SysJava seccomp JSON, relative to $SYSJAVA_RESULTS
#   READY_LOG    text in `docker logs` that marks the server as started (same marker as discovery)
#   READY_PORT   HTTP port
#   WEBAPP_DIR   where the static content is mounted in the container
#
# SysJava analyzed this image with its default command and no arguments. The
# image enables only Jetty's http and deploy modules, so it has no JSP support
# and the docker-library official test (jetty-hello-web, a JSP page) cannot
# pass on it, with or without a policy. The workload here is our own: static
# files (jetty_workload/ROOT, plus a generated 1 MiB file) requested with
# Apache Bench.

SUBJECT=jetty
IMAGE=jetty:9.4.51-jdk8-buster
POLICY=jetty_9.4.51-jdk8-buster/jetty_9.4.51-jdk8-buster.json
READY_LOG='Started @'
READY_PORT=8080
WEBAPP_DIR=/var/lib/jetty/webapps/ROOT
