# Subjects for workload_validation_ycsb.sh. This file is sourced by bash.
#
# For every subject listed in SUBJECTS:
#   IMAGE        the JDK 8 / Debian 10 image SysJava analyzed (built locally if missing)
#   POLICY       SysJava seccomp JSON, relative to $SYSJAVA_RESULTS
#   RUN_ARGS     `docker run` arguments, the ones SysJava's startup discovery used
#                (SysJava/docker_images/ENVIRONMENT.md), so the server starts the same way
#   READY_LOG    text in `docker logs` that marks the server as started (same marker as discovery)
#   READY_PORT   TCP port that must accept connections before the benchmark starts
#   SETUP_URLS   optional HTTP GETs made from outside the container before the
#                benchmark (space-separated; @IP@ = the container's address)
#   BINDING      YCSB binding (a name in YCSB/bin/bindings.properties) and
#   MODULE       the YCSB directory that builds it
#   MVN_ARGS     optional extra Maven arguments for building it
#   PATCH        optional patch (a file in ycsb_patches/) applied to the YCSB checkout first
#   PROPS        YCSB properties (space-separated key=value; @IP@ as above)
#   WORKLOADS    YCSB core workloads to run after the load, e.g. "a" or "a b c f"
#
# Storm, Groovy and Jetty are not listed: YCSB has no binding for them.

# orientdb is configured below but not run: YCSB's binding does not work with
# OrientDB 3.2. Its 2.2.37 client cannot talk to the server; built against the
# 3.2.19 client (MVN_ARGS) with two set-up fixes (PATCH) it connects and creates
# the database, but every operation fails, because the binding stores records
# through the built-in "dictionary" index, which a 3.2 database no longer has.
SUBJECTS=(solr elasticsearch)

IMAGE[solr]=solr:8.7.0-jdk8-buster
POLICY[solr]=solr_8.7.0-jdk8-buster/solr_8.7.0-jdk8-buster.json
RUN_ARGS[solr]=''
READY_LOG[solr]='Started @'
READY_PORT[solr]=8983
# stand-alone core named as YCSB's default table, schemaless (_default configset)
SETUP_URLS[solr]='http://@IP@:8983/solr/admin/cores?action=CREATE&name=usertable&configSet=_default'
BINDING[solr]=solr7
MODULE[solr]=solr7
PROPS[solr]='solr.base.url=http://@IP@:8983/solr'
WORKLOADS[solr]='a'

IMAGE[orientdb]=orientdb:3.2.19-jdk8-buster
POLICY[orientdb]=orientdb_3.2.19-jdk8-buster/orientdb_3.2.19-jdk8-buster.json
RUN_ARGS[orientdb]='-e ORIENTDB_ROOT_PASSWORD=root'
READY_LOG[orientdb]='OrientDB Studio available'
READY_PORT[orientdb]=2424
SETUP_URLS[orientdb]=''
BINDING[orientdb]=orientdb
MODULE[orientdb]=orientdb
# YCSB pins the OrientDB client to 2.2.37, which cannot talk to a 3.2 server
# (it fails creating the database). Build the binding against the client of the
# server's version instead; its test is not compiled. With a 3.x client the
# binding needs two one-line fixes in how it sets up the database (PATCH).
MVN_ARGS[orientdb]='-Dorientdb.version=3.2.19 -Dmaven.test.skip=true'
PATCH[orientdb]=orientdb-client-3.x.patch
# the binding creates the database itself (as the server's root user)
PROPS[orientdb]='orientdb.url=remote:@IP@:2424/ycsb orientdb.user=root orientdb.password=root orientdb.remote.storagetype=plocal'
WORKLOADS[orientdb]='a'

IMAGE[elasticsearch]=elasticsearch:7.5.2-jdk8-buster
POLICY[elasticsearch]=elasticsearch_7.5.2-jdk8-buster/elasticsearch_7.5.2-jdk8-buster.json
RUN_ARGS[elasticsearch]='-e ES_JAVA_OPTS="-Xms1g -Xmx1g"'
READY_LOG[elasticsearch]=' started'
READY_PORT[elasticsearch]=9200
SETUP_URLS[elasticsearch]=''
BINDING[elasticsearch]=elasticsearch5-rest
MODULE[elasticsearch]=elasticsearch5
# The binding's REST client (5.5.1) works against 7.5.2 for inserts, but reads
# and updates fail parsing the search response: Elasticsearch 7 changed the
# format of hits.total. PATCH asks the server for the old format (one line).
PATCH[elasticsearch]=elasticsearch-7.x.patch
# the binding creates the index itself; one node, so no replicas
PROPS[elasticsearch]='es.hosts.list=@IP@:9200 es.number_of_replicas=0'
WORKLOADS[elasticsearch]='a'
