# Subjects for workload_validation.sh  (whitespace-separated, one per line)
#
# subject   image   policy   inject   tests
#
#   image    exact image that was analyzed (pull by digest, image@sha256:..., to be safe)
#   policy   SysJava seccomp JSON, relative to the Prototype root (or absolute)
#   inject   which `docker run` calls of the test get the policy:
#              detached = only `docker run -d` (the server under test; clients stay unfiltered)
#              all      = every `docker run` (tests where the container itself is the workload)
#   tests    comma-separated docker-library/official-images tests (test/tests/<name>)
#
# TODO: zookeeper, tomcat, and jruby policy paths are guesses following the
# results/ naming scheme; fix them once those policies are on this machine.

