# Subjects for workload_validation.sh  (whitespace-separated, one per line)
#
# subject   image   policy   inject   tests
#
#   image    the JDK 8 / Debian 10 image SysJava analyzed. These are built locally
#            (not on Docker Hub); if missing, the driver builds them with
#            SysJava/docker_images/build_jdk8_images.sh <subject>.
#   policy   SysJava seccomp JSON, relative to $SYSJAVA_RESULTS
#            (default: ../SysJava/2_swat4j_vs_sysjava/sysjava_results, next to Prototype)
#   inject   which `docker run` calls of the test get the policy:
#              detached = only `docker run -d` (the server under test; clients stay unrestricted)
#              all      = every `docker run` (tests where the container itself is the workload)
#   tests    comma-separated docker-library/official-images tests (test/tests/<name>)
#
# Only the five paper subjects with official smoke tests are listed. Storm,
# OrientDB, Elasticsearch, Solr and Groovy have SysJava results but no
# official smoke test.

cassandra  cassandra:3.0.29-jdk8-buster  cassandra_3.0.29-jdk8-buster/cassandra_3.0.29-jdk8-buster.json  detached  cassandra-basics
zookeeper  zookeeper:3.4.14-jdk8-buster  zookeeper_3.4.14-jdk8-buster/zookeeper_3.4.14-jdk8-buster.json  detached  zookeeper-basics
tomcat     tomcat:7.0-jdk8-buster        tomcat_7.0-jdk8-buster/tomcat_7.0-jdk8-buster.json              detached  tomcat-hello-world
jetty      jetty:9.4.51-jdk8-buster      jetty_9.4.51-jdk8-buster/jetty_9.4.51-jdk8-buster.json          detached  jetty-hello-web
jruby      jruby:9.4.2.0-jdk8-buster     jruby_9.4.2.0-jdk8-buster/jruby_9.4.2.0-jdk8-buster.json        all       ruby-hello-world,ruby-standard-libs,ruby-gems,ruby-bundler,ruby-nonroot,ruby-binstubs,ruby-native-extension
