# Subject of workload_validation_groovy.sh. This file is sourced by bash.
#
#   SUBJECT      name of the results folder
#   IMAGE        the JDK 8 / Debian 10 image SysJava analyzed (built locally if missing)
#   POLICY       SysJava seccomp JSON, relative to $SYSJAVA_RESULTS
#   BENCH_TAG    tag of github.com/apache/groovy the benchmark scripts are taken from
#   BENCHMARKS   "script:inputs" entries; script is benchmark/bench/<script>.groovy,
#                and it is run once per input: groovy <script>.groovy <input>
#
# SysJava analyzed this image with its default command, which runs
# `groovy -e '<print the version, then sleep>'`. The benchmarks are started with
# the same `groovy` launcher, one container per run.
#
# BENCHMARKS is the set that Groovy's own driver (benchmark/bench.groovy at
# BENCH_TAG) has enabled, with the driver's inputs; the driver has the other
# scripts of benchmark/bench commented out.

SUBJECT=groovy
IMAGE=groovy:4.0.0-jdk8-buster
POLICY=groovy_4.0.0-jdk8-buster/groovy_4.0.0-jdk8-buster.json
BENCH_TAG=GROOVY_4_0_0
BENCHMARKS=(
  "hello:1"
  "ackermann:5 6 7 8"
  "ary:10 100 1000 1000000"
  "fibo:30 31 32 33 34"
)
