# Subject of workload_validation_storm.sh. This file is sourced by bash.
#
#   SUBJECT   name of the results folder
#   IMAGE     the JDK 8 / Debian 10 image SysJava analyzed (built locally if missing)
#   POLICY    SysJava seccomp JSON, relative to $SYSJAVA_RESULTS
#
# SysJava analyzed this image started as `storm nimbus` on a network with a
# ZooKeeper sidecar (zookeeper:3.7), host name and alias "nimbus"
# (SysJava/2_swat4j_vs_sysjava/scripts/run_jdk8_target.sh). The script starts
# nimbus the same way; only nimbus is traced and run under the policy.

SUBJECT=storm
IMAGE=storm:2.4.0-jdk8-buster
POLICY=storm_2.4.0-jdk8-buster/storm_2.4.0-jdk8-buster.json
