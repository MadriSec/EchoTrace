# Subject of workload_validation_orientdb.sh. This file is sourced by bash.
#
#   SUBJECT        name of the results folder
#   IMAGE          the JDK 8 / Debian 10 image SysJava analyzed (built locally if missing)
#   POLICY         SysJava seccomp JSON, relative to $SYSJAVA_RESULTS
#   ROOT_PASSWORD  password of the server's root user
#   RUN_ARGS       `docker run` arguments of the server, the ones SysJava's startup
#                  discovery used (SysJava/docker_images/ENVIRONMENT.md)
#   READY_LOG      text in `docker logs` that marks the server as started (same marker as discovery)
#   READY_PORT     port of the binary protocol, which the stress tester connects to
#
# The workload is OrientDB's own Stress Test Tool (stresstester), which is part
# of the image (orientdb-tools-3.2.19.jar): nothing is downloaded. YCSB is not
# used for OrientDB; ycsb_subjects.conf records why.

SUBJECT=orientdb
IMAGE=orientdb:3.2.19-jdk8-buster
POLICY=orientdb_3.2.19-jdk8-buster/orientdb_3.2.19-jdk8-buster.json
ROOT_PASSWORD=root
RUN_ARGS=(-e "ORIENTDB_ROOT_PASSWORD=$ROOT_PASSWORD")
READY_LOG='OrientDB Studio available'
READY_PORT=2424
